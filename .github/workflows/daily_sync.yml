name: Daily Academic Sync & Analytics Pipeline

on:
  schedule:
    # Runs at 00:00 UTC (05:30 AM IST) daily
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Prevent concurrent overlapping runs across multiple dispatch/cron triggers
concurrency:
  group: sync-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (Tesseract & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils qpdf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Incremental Google Drive Sync
        run: |
          python sync_drive_pyqs.py

      - name: Re-classify and Organize PYQs
        run: |
          python sort_pyqs_by_semester.py

      - name: Generate Markdown Readmes, Web Catalog & Sharded Drive Index
        run: |
          python generate_readmes.py
          python generate_catalog.py
          python build_drive_shards.py

      - name: Generate Syllabus Coverage & Exam Weightage Analytics
        run: |
          python analyze_syllabus_weightage.py

      # NOTE: generate_solutions.py is intentionally omitted here.
      # AI solution generation is strictly performed on the local GPU workstation
      # with Qwen + textbook grounding to eliminate hallucinations and preserve accuracy.

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new documents or analytics changes detected."
          else
            git commit -m "chore(sync): automated academic drive sync & analytics refresh [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
